<article
  class="{{ if not .Site.Params.homepage.showRecent }}
    h-full
  {{ end }} flex flex-col items-center justify-center text-center"
>
  {{ partial "profile.html" }}
  <section class="prose dark:prose-invert">{{ .Content | emojify }}</section>
</article>
<section class="home-updates">
  <h2 class="mt-8 text-2xl font-extrabold">{{ if eq .Site.Language.Lang "pt-br" }}Atualizações{{ else }}Updates{{ end }}</h2>
  {{ partial "updates/feed.html" (dict "limit" (.Site.Params.homepage.recentLimit | default 5)) }}
</section>
