name: Translate Portuguese posts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/pt/blog/**"
      - "content/pt/microposts/**"
      - "content/pt/books/**"
      - "content/pt/photos/**"
      - "content/pt/media/**"
      - "scripts/translate_pt_to_en.py"
      - "scripts/site_content.py"
      - ".github/workflows/translate.yml"

permissions:
  contents: write

jobs:
  translate:
    if: ${{ !contains(github.event.head_commit.message, '[skip translate]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Translate published Portuguese posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5.6' }}
        run: python3 scripts/translate_pt_to_en.py

      - name: Publish translated posts
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PDS: ${{ secrets.BLUESKY_PDS || 'https://bsky.social' }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202606' }}
        run: python3 scripts/social_publish.py --lang-prefix en --only-auto-translated

      - name: Commit translated content
        id: translated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en data/social/syndication.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-translate Portuguese posts [skip social] [skip translate]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No translated content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Hugo
        if: steps.translated.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build translated site
        if: steps.translated.outputs.changed == 'true'
        run: hugo --minify --printPathWarnings --destination public --cleanDestinationDir

      - name: Validate translated site
        if: steps.translated.outputs.changed == 'true'
        run: |
          python3 scripts/validate_site.py --site-dir public
          python3 scripts/social_publish.py --dry-run

      - name: Deploy translated site
        if: steps.translated.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
